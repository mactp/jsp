- title: Bramble management
  when: Winter 2026 · date TBC
  type: Volunteer event
  location: inside the gate
  description: Bramble to be cut back to control its spread in areas where it can
    overwhelm other valuable shrubs and plants. Bramble encroaching on benches
    and paths also needs cutting back.
  duration: 2 hours, but any time you can give is appreciated
