- title: Dock management
  when: Early summer 2027 · date TBC
  type: Volunteer event
  location: inside the gate
  description: No chemical controls are used in the park. Dock management is
    therefore done by hand. By cutting off the flowering shoots as the seeds
    form, but before they are viable, the plant is prevented from seeding. Also
    digging will remove some of the tap root and weaken the plants further.
