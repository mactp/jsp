  <style>
    /* ── Reason selector ── */
    .contact-reasons {
      padding: clamp(48px, 6vw, 72px) 0 0;
      background: #fff;
    }
    .contact-reasons h2 { color: var(--brand-dark); margin-bottom: 6px; }
    .contact-reasons > .container > p {
      color: var(--muted);
      margin-bottom: 28px;
      max-width: 560px;
    }
    .reason-tabs {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    .reason-tab {
      background: #fff;
      border: 2px solid #e0e0dc;
      border-radius: 50px;
      padding: 11px 24px;
      font-family: 'Nunito', sans-serif;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--fg);
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .reason-tab:hover { border-color: var(--brand); color: var(--brand); }
    .reason-tab.active { background: var(--brand); border-color: var(--brand); color: #fff; }

    /* ── Main contact layout ── */
    .contact-main {
      padding: clamp(36px, 5vw, 56px) 0 clamp(48px, 6vw, 80px);
      background: #fff;
    }
    /* Form left, North Yorkshire Council box right; stacked below 900px */
    .contact-grid {
      display: grid;
      grid-template-columns: minmax(0, 3fr) minmax(0, 2fr);
      gap: 32px;
      align-items: start;
    }
    .contact-grid > .contact-form-wrap { max-width: none; margin: 0; }
    @media (max-width: 899px) { .contact-grid { grid-template-columns: minmax(0, 1fr); } }

    /* ── Form ── */
    .contact-form-wrap h2 {
      color: var(--brand-dark);
      margin-top: 0;
      margin-bottom: 6px;
    }
    .contact-form-wrap > p {
      margin-bottom: 28px;
    }
    .contact-form-wrap > p a { color: var(--brand); font-weight: 500; }

    .contact-form { display: flex; flex-direction: column; gap: 18px; }

    .form-field { display: flex; flex-direction: column; gap: 6px; }
    .form-field label { font-size: 1rem; font-weight: 600; color: var(--fg); }
    .form-field input,
    .form-field textarea {
      padding: 12px 14px;
      border: 1.5px solid #d8d8d4;
      border-radius: 8px;
      font-family: 'Nunito', sans-serif;
      font-size: 1rem;
      color: var(--fg);
      background: #fafaf8;
      transition: border-color 0.2s ease, background 0.2s ease;
      width: 100%;
    }
    .form-field input:focus,
    .form-field textarea:focus {
      outline: none;
      border-color: var(--brand);
      background: #fff;
    }
    .form-field input:focus-visible,
    .form-field textarea:focus-visible {
      outline: 3px solid var(--brand-2);
      outline-offset: 2px;
    }
    .form-field textarea { resize: vertical; min-height: 140px; }

    .consent-row {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      font-size: 0.9rem;
      color: var(--muted);
      line-height: 1.5;
      cursor: pointer;
    }
    .consent-row input[type="checkbox"] {
      margin-top: 3px;
      flex-shrink: 0;
      width: 16px;
      height: 16px;
      accent-color: var(--brand);
      cursor: pointer;
    }

    .submit-btn {
      display: inline-block;
      background: var(--brand);
      color: #fff;
      border: none;
      padding: 14px 36px;
      border-radius: 50px;
      font-family: 'Nunito', sans-serif;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.2s ease;
    }
    .submit-btn:hover { background: var(--brand-dark); transform: scale(1.03); }

    .form-status { font-size: 1rem; color: var(--brand); font-weight: 600; }
    .form-status.is-success { color: var(--brand); }
    .form-status.is-error { color: #a33a2a; }
    .submit-btn[disabled] { opacity: .65; cursor: progress; transform: none; }

    /* ── Sidebar ── */
    .contact-sidebar { display: flex; flex-direction: column; gap: 20px; }

    .contact-info-card {
      background: #fafaf8;
      border: 1px solid #e4e4e0;
      border-radius: 10px;
      padding: 24px 26px;
    }
    .contact-info-card h3 { margin: 0 0 10px; font-size: 1.05rem; color: var(--brand-dark); }
    .contact-info-card p {
      margin: 0 0 10px;
      line-height: 1.65;
    }
    .contact-info-card p:last-child { margin-bottom: 0; }
    .contact-info-card a { color: var(--brand); font-weight: 500; }
    .contact-info-card .card-btn {
      display: inline-block;
      margin-top: 6px;
      background: var(--brand);
      color: #fff;
      padding: 11px 22px;
      border-radius: 50px;
      text-decoration: none;
      font-size: 1rem;
      font-weight: 600;
      transition: background 0.2s ease;
    }
    .contact-info-card .card-btn:hover { background: var(--brand-dark); text-decoration: none; }

    .emergency-block {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid #e4e4e0;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .emergency-block p {
      margin: 0;
      line-height: 1.55;
    }
    .emergency-block strong { color: var(--fg); }
    .contact-info-card .emergency-block p { margin-left: 0; margin-right: 0; }

    /* hp */
    .hp-field { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
  </style>
